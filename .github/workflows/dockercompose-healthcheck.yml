# Workflow to check health of dockercompose based development stacks
name: dockercompose-healthcheck

on:
  pull_request:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: it-at-m/lhm_actions/action-templates/actions/action-dockercompose-healthcheck@808f574bd8867b31524b254679fc34fb1fd78ea2 # v1.6.2
        with:
          skip-exited: true # required for keycloakmigration init container
          compose-file-path: "./dispatch-service/stack/"

  matching:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: it-at-m/lhm_actions/action-templates/actions/action-dockercompose-healthcheck@808f574bd8867b31524b254679fc34fb1fd78ea2 # v1.6.2
        with:
          skip-exited: true # required for keycloakmigration init container
          compose-file-path: "./matching-service/stack/"
