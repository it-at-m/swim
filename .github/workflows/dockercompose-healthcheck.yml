# Workflow to check health of dockercompose based development stacks
name: dockercompose-healthcheck

on:
  pull_request:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: it-at-m/lhm_actions/action-templates/actions/action-dockercompose-healthcheck@1f4370c5e243b96e9a90d7569b20b535e24e7c17 # v1.5.1
        with:
          skip-exited: true # required for keycloakmigration init container
          compose-file-path: "./dispatch-service/stack/"

  matching:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: it-at-m/lhm_actions/action-templates/actions/action-dockercompose-healthcheck@1f4370c5e243b96e9a90d7569b20b535e24e7c17 # v1.5.1
        with:
          skip-exited: true # required for keycloakmigration init container
          compose-file-path: "./matching-service/stack/"
